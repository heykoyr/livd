<svg xmlns="http://www.w3.org/2000/svg" width="940" height="576" viewBox="0 0 940 576" role="img" aria-label="How a review reaches publication in Livd, and what each layer refuses">
<title>A review's path to publication</title>
<rect width="940" height="576" fill="#0D0E0D"/>
<text x="34" y="42" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif" font-size="26" fill="#F2F1ED">A review’s path to publication</text>
<text x="34" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#A3A69F">Each layer refuses something. None of them trusts the one above it.</text>
<line x1="34" y1="82" x2="906" y2="82" stroke="#2A2D2A" stroke-width="1"/>
<rect x="34" y="96" width="462" height="78" rx="8" fill="#161816" stroke="#2A2D2A" stroke-width="1"/>
<rect x="34" y="96" width="3" height="78" rx="1.5" fill="#1C2E28"/>
<text x="52" y="117" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.1" fill="#83867F">BROWSER</text>
<text x="52" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#F2F1ED">A resident asks to be verified</text>
<text x="52" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#83867F">Sends one position, once</text>
<line x1="74" y1="174" x2="74" y2="190" stroke="#3C403C" stroke-width="1"/>
<path d="M70.5 185.5 L74 190 L77.5 185.5" fill="none" stroke="#3C403C" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="540" y="129" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#83867F">Untrusted by definition — every value here is</text>
<text x="540" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#83867F">client-supplied</text>
<rect x="34" y="190" width="462" height="78" rx="8" fill="#161816" stroke="#2A2D2A" stroke-width="1"/>
<rect x="34" y="190" width="3" height="78" rx="1.5" fill="#1C2E28"/>
<text x="52" y="211" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.1" fill="#83867F">SERVER ACTION</text>
<text x="52" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#F2F1ED">Parsed, authorised, linted</text>
<text x="52" y="252" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#D8E4DE">content-linter.ts</text>
<text x="184.15" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#83867F">Zod at the boundary</text>
<line x1="74" y1="268" x2="74" y2="284" stroke="#3C403C" stroke-width="1"/>
<path d="M70.5 279.5 L74 284 L77.5 279.5" fill="none" stroke="#3C403C" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="540" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.1" fill="#E09365">REFUSES</text>
<text x="540" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#A3A69F">Contact details, named individuals, unit numbers — with</text>
<text x="540" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#A3A69F">a specific instruction saying what to change</text>
<rect x="34" y="284" width="462" height="78" rx="8" fill="#161816" stroke="#2A2D2A" stroke-width="1"/>
<rect x="34" y="284" width="3" height="78" rx="1.5" fill="#1C2E28"/>
<text x="52" y="305" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.1" fill="#83867F">POSTGRES · FUNCTION</text>
<text x="52" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#F2F1ED">The proximity verdict is decided</text>
<text x="52" y="346" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#D8E4DE">livd_verify_property_location</text>
<line x1="74" y1="362" x2="74" y2="378" stroke="#3C403C" stroke-width="1"/>
<path d="M70.5 373.5 L74 378 L77.5 373.5" fill="none" stroke="#3C403C" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="540" y="310" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.1" fill="#E09365">REFUSES</text>
<text x="540" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#A3A69F">A client that asserts its own verdict. It may ask; it</text>
<text x="540" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#A3A69F">may never answer</text>
<rect x="34" y="378" width="462" height="78" rx="8" fill="#161816" stroke="#2A2D2A" stroke-width="1"/>
<rect x="34" y="378" width="3" height="78" rx="1.5" fill="#1C2E28"/>
<text x="52" y="399" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.1" fill="#83867F">POSTGRES · TRIGGER + RLS</text>
<text x="52" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#F2F1ED">The level is derived, not accepted</text>
<text x="52" y="440" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#D8E4DE">livd_derive_review_verification</text>
<text x="281.45000000000005" y="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#83867F">BEFORE INSERT</text>
<line x1="74" y1="456" x2="74" y2="472" stroke="#3C403C" stroke-width="1"/>
<path d="M70.5 467.5 L74 472 L77.5 467.5" fill="none" stroke="#3C403C" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="540" y="404" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.1" fill="#E09365">REFUSES</text>
<text x="540" y="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#A3A69F">A verification belonging to another account or another</text>
<text x="540" y="442" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#A3A69F">property</text>
<rect x="34" y="472" width="462" height="78" rx="8" fill="#161816" stroke="#3C403C" stroke-width="1"/>
<rect x="34" y="472" width="3" height="78" rx="1.5" fill="#D8E4DE"/>
<text x="52" y="493" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.1" fill="#83867F">STORED</text>
<text x="52" y="514" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#F2F1ED">The review row</text>
<text x="52" y="534" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#D8E4DE">reviews</text>
<text x="114.65" y="534" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#83867F">Published, permanent, unlinked</text>
<text x="540" y="498" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.1" fill="#E09365">HOLDS NO</text>
<text x="540" y="518" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#A3A69F">Latitude · longitude · accuracy · distance. A position</text>
<text x="540" y="536" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#A3A69F">was an argument, never a column</text>
</svg>
