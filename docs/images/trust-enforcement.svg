<svg xmlns="http://www.w3.org/2000/svg" width="940" height="576" viewBox="0 0 940 576" role="img" aria-label="How a review reaches publication in Livd, and what each layer refuses">
<title>A review's path to publication</title>
<rect width="940" height="576" fill="#FBFAF8"/>
<text x="34" y="42" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif" font-size="26" fill="#17191A">A review’s path to publication</text>
<text x="34" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#5C5F5B">Each layer refuses something. None of them trusts the one above it.</text>
<line x1="34" y1="82" x2="906" y2="82" stroke="#E5E1D9" stroke-width="1"/>
<rect x="34" y="96" width="462" height="78" rx="8" fill="#FFFFFF" stroke="#E5E1D9" stroke-width="1"/>
<rect x="34" y="96" width="3" height="78" rx="1.5" fill="#E8EFEB"/>
<text x="52" y="117" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.1" fill="#6D7069">BROWSER</text>
<text x="52" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#17191A">A resident asks to be verified</text>
<text x="52" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6D7069">Sends one position, once</text>
<line x1="74" y1="174" x2="74" y2="190" stroke="#CFC9BD" stroke-width="1"/>
<path d="M70.5 185.5 L74 190 L77.5 185.5" fill="none" stroke="#CFC9BD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="540" y="129" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6D7069">Untrusted by definition — every value here is</text>
<text x="540" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6D7069">client-supplied</text>
<rect x="34" y="190" width="462" height="78" rx="8" fill="#FFFFFF" stroke="#E5E1D9" stroke-width="1"/>
<rect x="34" y="190" width="3" height="78" rx="1.5" fill="#E8EFEB"/>
<text x="52" y="211" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.1" fill="#6D7069">SERVER ACTION</text>
<text x="52" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#17191A">Parsed, authorised, linted</text>
<text x="52" y="252" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#12312A">content-linter.ts</text>
<text x="184.15" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6D7069">Zod at the boundary</text>
<line x1="74" y1="268" x2="74" y2="284" stroke="#CFC9BD" stroke-width="1"/>
<path d="M70.5 279.5 L74 284 L77.5 279.5" fill="none" stroke="#CFC9BD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="540" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.1" fill="#AA5329">REFUSES</text>
<text x="540" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5C5F5B">Contact details, named individuals, unit numbers — with</text>
<text x="540" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5C5F5B">a specific instruction saying what to change</text>
<rect x="34" y="284" width="462" height="78" rx="8" fill="#FFFFFF" stroke="#E5E1D9" stroke-width="1"/>
<rect x="34" y="284" width="3" height="78" rx="1.5" fill="#E8EFEB"/>
<text x="52" y="305" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.1" fill="#6D7069">POSTGRES · FUNCTION</text>
<text x="52" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#17191A">The proximity verdict is decided</text>
<text x="52" y="346" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#12312A">livd_verify_property_location</text>
<line x1="74" y1="362" x2="74" y2="378" stroke="#CFC9BD" stroke-width="1"/>
<path d="M70.5 373.5 L74 378 L77.5 373.5" fill="none" stroke="#CFC9BD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="540" y="310" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.1" fill="#AA5329">REFUSES</text>
<text x="540" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5C5F5B">A client that asserts its own verdict. It may ask; it</text>
<text x="540" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5C5F5B">may never answer</text>
<rect x="34" y="378" width="462" height="78" rx="8" fill="#FFFFFF" stroke="#E5E1D9" stroke-width="1"/>
<rect x="34" y="378" width="3" height="78" rx="1.5" fill="#E8EFEB"/>
<text x="52" y="399" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.1" fill="#6D7069">POSTGRES · TRIGGER + RLS</text>
<text x="52" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#17191A">The level is derived, not accepted</text>
<text x="52" y="440" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#12312A">livd_derive_review_verification</text>
<text x="281.45000000000005" y="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6D7069">BEFORE INSERT</text>
<line x1="74" y1="456" x2="74" y2="472" stroke="#CFC9BD" stroke-width="1"/>
<path d="M70.5 467.5 L74 472 L77.5 467.5" fill="none" stroke="#CFC9BD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="540" y="404" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.1" fill="#AA5329">REFUSES</text>
<text x="540" y="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5C5F5B">A verification belonging to another account or another</text>
<text x="540" y="442" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5C5F5B">property</text>
<rect x="34" y="472" width="462" height="78" rx="8" fill="#FFFFFF" stroke="#CFC9BD" stroke-width="1"/>
<rect x="34" y="472" width="3" height="78" rx="1.5" fill="#12312A"/>
<text x="52" y="493" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.1" fill="#6D7069">STORED</text>
<text x="52" y="514" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#17191A">The review row</text>
<text x="52" y="534" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#12312A">reviews</text>
<text x="114.65" y="534" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6D7069">Published, permanent, unlinked</text>
<text x="540" y="498" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.1" fill="#AA5329">HOLDS NO</text>
<text x="540" y="518" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5C5F5B">Latitude · longitude · accuracy · distance. A position</text>
<text x="540" y="536" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5C5F5B">was an argument, never a column</text>
</svg>
